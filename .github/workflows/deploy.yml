name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publishing an incomplete directory would serve a 404 on the live
      # domain, which is worse than not deploying at all.
      - name: Refuse to publish an incomplete site
        run: |
          missing=0
          for f in index.html accord.html priorities.html apply.html about.html \
                   tokens.css base.css style.css CNAME; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::$f is missing"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      # Rainshadow is set up and incubated by Builders VC, but every Oregon
      # organisation on the About page is still a counterpart to approach. If
      # that sentence ever falls out of a page, the site starts asserting
      # relationships that do not exist, so the deploy stops instead.
      - name: Every page says no Oregon organisation has agreed
        run: |
          bad=0
          for f in index.html accord.html priorities.html apply.html about.html; do
            grep -q "No Oregon organisation named here has agreed to participate" "$f" || {
              echo "::error file=$f::$f no longer says that no Oregon organisation has agreed"
              bad=1
            }
          done
          [ "$bad" -eq 0 ] || exit 1

      # robots.txt and the per page meta tags have to say the same thing. A
      # site that is half open gets indexed in pieces, which is worse than
      # either answer, so a disagreement stops the deploy.
      - name: robots.txt and the meta tags agree
        run: |
          pages="index.html accord.html priorities.html apply.html about.html"
          if [ -f robots.txt ] && grep -qi '^Disallow: /$' robots.txt; then
            for f in $pages; do
              grep -qi 'name="robots"' "$f" || {
                echo "::error file=$f::robots.txt disallows crawling but $f has no robots meta tag"
                exit 1
              }
            done
            echo "closed to search engines, as intended"
          else
            for f in $pages; do
              grep -qi 'name="robots"[^>]*noindex' "$f" && {
                echo "::error file=$f::the site is open but $f still carries a noindex tag"
                exit 1
              }
            done
            [ -f sitemap.xml ] || {
              echo "::error::the site is open to search engines but there is no sitemap.xml"
              exit 1
            }
            echo "open to search engines, with a sitemap"
          fi

      # This repo is public, because that is what makes Pages free.
      - name: Nothing confidential
        run: |
          if grep -rliE 'amii|alberta machine|alberta innovates|carbon health|uceed' \
               --include='*.html' --include='*.css' . >/dev/null 2>&1; then
            echo "::error::a banned entity appears in the site source"
            exit 1
          fi
          echo "no banned entity in the source"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
